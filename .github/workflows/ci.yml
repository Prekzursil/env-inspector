name: env-inspector-ci

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - feature/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Compile check
        shell: bash
        run: |
          python -m py_compile env_inspector.py env_inspector_core/*.py env_inspector_gui/*.py tests/*.py

      - name: Run tests
        shell: bash
        run: |
          pytest -q -s --cov=env_inspector --cov=env_inspector_core --cov=env_inspector_gui --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Run platform-style coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p coverage_platform .tmp_platform
          export TMPDIR="$PWD/.tmp_platform"
          python -m pytest -q -s \
            --cov=env_inspector \
            --cov=env_inspector_core \
            --cov=env_inspector_gui \
            --cov-branch \
            --cov-report=xml:coverage_platform/python-coverage.xml \
            --cov-report=term-missing 2>&1 | tail -120

      - name: Upload coverage XMLs
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-coverage-xml-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage_platform/python-coverage.xml
          if-no-files-found: warn
          retention-days: 7
