version: 2

# Fleet standard (Prekzursil/quality-zero-platform docs/BEST-CONFIG.md §4):
# one rail per manifest tree for every ecosystem in the checkout plus
# github-actions; weekly cadence; security updates grouped per ecosystem;
# minor + patch grouped; majors NEVER ignored — each major arrives as its own
# PR so a fix that only ships in a new major can land under the
# zero-tolerance dependency gate. The previous blanket
# `ignore: version-update:semver-major` was the legacy renderer default the
# standard explicitly supersedes; it is removed here.
#
# `directory:` is an exact path, not a prefix. All Python manifests
# (requirements.txt, requirements-build.txt, pyproject.toml) live at the repo
# root, so one pip rail covers that tree.
updates:
  # Python rail — requirements*.txt / pyproject.toml at /
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - type:chore
    groups:
      pip-security:
        # one PR can clear every open advisory in this ecosystem
        applies-to: security-updates
        patterns:
          - "*"
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Workflows rail — .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - type:chore
      - area:ci
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
