version: 2

# FLEET SECURITY STANDARD: weekly cadence, every ecosystem present, ZERO
# ignored updates. The previous file ignored ALL semver-major updates for the
# github-actions rail (`ignore: - dependency-name: '*' update-types:
# version-update:semver-major`), which is exactly what the fleet rule forbids
# -- an ignore hides security updates of the ignored dependency too. Nothing
# is muted here; a breaking bump arrives as a PR the repo's own CI gates.
updates:
  # Python rail -- pyproject.toml, requirements.txt, requirements-build.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]

  # the workflows themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
